
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Owner Management System</title>

    <!-- Connecting CSS -->
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <header>
        <h1>Vehicle Service Management System</h1>
        <p>Owner Registration and Profile Management</p>
    </header>

    <main>
        <section class="container">

            <h2>Owner Registration</h2>

            <form id="ownerForm">

                <input type="hidden" id="editOwnerId">

                <div class="form-group">
                    <label for="name">Owner Name</label>
                    <input type="text" id="name" placeholder="Enter owner name" required>
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="tel" id="mobile" placeholder="10-digit mobile number" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter email address" required>
                </div>

                <div class="form-group">
                    <label for="address">Residential Address</label>
                    <textarea id="address" placeholder="Enter residential address" required></textarea>
                </div>

                <button type="submit" id="submitBtn">Register Owner</button>
                <button type="reset" class="secondary-btn">Clear</button>

            </form>

        </section>

        <section class="container">

            <h2>Registered Owners</h2>

            <input
                type="search"
                id="searchInput"
                placeholder="Search by name, ID or mobile number"
            >

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Owner ID</th>
                            <th>Name</th>
                            <th>Mobile</th>
                            <th>Email</th>
                            <th>Address</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="ownerTableBody">
                    </tbody>
                </table>
            </div>

        </section>

        <section class="container" id="profileSection" hidden>
            <h2>Owner Profile</h2>
            <div id="profileDetails"></div>
            <button type="button" class="secondary-btn" id="closeProfile">
                Close Profile
            </button>
        </section>

    </main>

    <!-- Connecting JavaScript -->
    <script src="script.js"></script>

</body>
</html>
